name: CI

on:
  push:
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash

env:
  TZ: UTC

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out flattrace-pi
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Verify bundled npm
        run: |
          umask 002
          # Node v24.18.0 bundles npm 11.16.0; same pin as flattrace.
          [[ "$(npm --version)" == '11.16.0' ]]

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.11'

      - name: Install dependencies
        run: |
          umask 002
          # Resolves the exact flattrace pin from the npm registry, so this
          # step goes green once that reviewed version is published. Until
          # then, verify locally against a local flattrace checkout instead
          # of this job.
          npm install --ignore-scripts
          # One test shells out to `python -m flattrace check`; install that
          # pure-Python checker at the same exact version as the npm pin.
          pip install --no-cache-dir "flattrace==$(node -p "require('./package.json').dependencies.flattrace")"

      - name: Run the test suite
        run: |
          umask 002
          node --test tests/*.test.mjs
